[project]
name = "booking-api"
version = "1.0.0"
description = "Appointments, waitlists and durable reminders for independent professionals"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
