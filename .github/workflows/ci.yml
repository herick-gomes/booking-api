name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://booking:test-only@localhost:5432/booking_test
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: ci-only-not-a-production-signing-key-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - name: Verify migration round trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Exercise HTTP booking and waitlist flow
        run: docker compose exec -T api python scripts/demo.py
      - name: Verify background delivery
        run: docker compose exec -T api python -m scripts.check_delivery
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
